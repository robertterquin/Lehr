<!doctype html>
<html lang="fil">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#140f30" />
    <meta name="description" content="Ilapat ang bawat umiikot na patong at sindihan ang bituin ngayong gabi: larong Pamaskong Pinoy, iisang bituin para sa lahat, gabi-gabi." />
    <title>Parol</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Parol" />
    <!-- Link previews (Messenger, Facebook, X). %SITE_URL% is filled in at build time: see vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Parol" />
    <meta property="og:title" content="Parol · sindihan ang bituin ngayong gabi" />
    <meta property="og:description" content="Ilapat ang bawat umiikot na patong at sindihan ang bituin ngayong gabi: larong Pamaskong Pinoy, iisang bituin para sa lahat, gabi-gabi." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Isang nagliliwanag na parol sa ibabaw ng kalye sa gabi, katabi ng salitang Parol." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/loading.css" />
  </head>
  <body>
    <!-- Shown until the game starts; React replaces it. -->
    <div id="root">
      <div class="loading" role="status">
        <span class="loading-mark">Parol</span>
        <span class="loading-note">Sinisindihan ang bituin ngayong gabi…</span>
        <span class="loading-bar"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
